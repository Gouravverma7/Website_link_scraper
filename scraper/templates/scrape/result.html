<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Collector</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
        body {
            background: #f4f6f9;
        }
        .card-custom {
            border-radius: 15px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.1);
        }
        .table-custom {
            border-radius: 10px;
            overflow: hidden;
        }
        .header-title {
            font-weight: 700;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="container py-4">

        <!-- Title Section -->
        <div class="text-center mb-4">
            <h1 class="header-title text-primary">🔗 Link Collector</h1>
            <p class="text-muted">Store and manage all of your scraped links.</p>
        </div>

        <!-- Form Card -->
        <div class="card card-custom p-4 mb-4">

            <form action="/" method="POST">
                {% csrf_token %}

                <div class="row g-3">

                    <!-- Input Field -->
                    <div class="col-12 col-md-6">
                        <input 
                            type="text" 
                            class="form-control form-control-lg" 
                            name="site" 
                            id="site" 
                            placeholder="Enter site link..."
                        >
                    </div>

                    <!-- Scrape Button -->
                    <div class="col-12 col-md-3 d-grid">
                        <button class="btn btn-primary btn-lg">Scrape Site</button>
                    </div>

                    <!-- Delete All Button -->
                    <div class="col-12 col-md-3 d-grid">
                        <a href="/delete" class="btn btn-danger btn-lg">Delete All</a>
                    </div>

                </div>
            </form>

        </div>

        <!-- Table Section -->
        <div class="card card-custom table-custom">

            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Stored Links</h5>
            </div>

            <div class="card-body p-0">

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                          <tr>
                            <th scope="col">S.No</th>
                            <th scope="col">Website Name</th>
                            <th scope="col">Link Address</th>
                          </tr>
                        </thead>
                        <tbody>
                          {% for link in data %}
                          <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ link.name }}</td>
                            <td>{{ link.address }}</td>
                          </tr>
                          {% endfor %}
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
</body>
</html>
