<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>
</head>
<body>
    <div class="container">
         <!-- <div class="row"> -->
            <div class="col-md-12 m-5 d-flex justify-content-center">
                <h1>Link Collector</h1>
            </div>
        </div>
        <div class="row m-5">
            <div class="col-md-4">
                <form action="/" method="POST">
                    {% csrf_token %}
                    <input type="text" class="form-control" name="site" id="site" placeholder="Enter Site link ">
                </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary" type="submit">Scrape Site</button>
                    </div>
                    </form>
                    <div class="col-md-6">
                        <a href="/delete" class="btn btn-warning">Delete</a>
                    </div>
        </div>

    </div>



    <div class="container">
      <div class="row">
        <div class="col-md-8">
          <table class="table">
            <thead class="table-dark">
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Link Address</th>
              </tr>
            </thead>
            <tbody>
              {% for link in data %}
              <tr>
                <td>{{link.id}}</td>
                <td>{{link.name}}</td>
                <td>{{link.address}}</td>
              </tr>
              {% endfor%}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
